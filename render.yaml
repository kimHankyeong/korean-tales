# Render 블루프린트 — korean_tales 게임 서버 (requirements 12번 배포 환경)
# 배포 절차는 README.md의 "Render 배포" 섹션 참고.
#
# ⚠️ 이 파일은 "무료(free) 플랜에서 그대로 배포되도록" 구성되어 있다.
#   Render의 영구 디스크(disk)는 무료 플랜에서 지원되지 않아서, disk 블록이 있으면
#   블루프린트 검증 단계에서 오류가 난다. 그래서 기본값은:
#   - 디스크 없음 → SQLite·업로드 파일이 로컬 경로에 저장되고,
#     **재배포/재시작 시 계정 데이터와 아바타가 초기화된다** (지인 테스트용으로만 적합)
#
# 계정 데이터를 보존하려면 (starter 플랜 이상):
#   1) plan: starter 로 변경
#   2) 아래 "disk:" 블록의 주석을 해제
#   3) DATABASE_URL 을 file:/data/korean_tales.db 로,
#      UPLOADS_DIR 을 /data/uploads 로 변경
#
# 무료 티어 특성(12번 섹션): 15분 무활동 시 슬립 → 재접속 시 수십 초 콜드스타트.
# 클라이언트 로비의 "서버를 깨우는 중" 안내(ServerWakeNotice)가 이 구간을 표시한다.

services:
  - type: web
    name: korean-tales-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:generate --workspace @korean-tales/server
    # start:deploy = prisma db push(스키마 반영) 후 서버 기동
    startCommand: npm run start:deploy --workspace @korean-tales/server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.1 # Node 22 LTS 고정 (CLAUDE.md의 Node 24 이슈 참고)
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db # free 플랜: 임시 저장 (starter + 디스크 사용 시 file:/data/korean_tales.db)
      - key: UPLOADS_DIR
        value: ./uploads # free 플랜: 임시 저장 (starter + 디스크 사용 시 /data/uploads)
      # 클라이언트 배포 도메인으로 CORS 제한 — 아래 korean-tales-client 서비스의 실제 배포 URL과 일치해야 함
      # (Render가 이름 충돌로 다른 URL을 배정했다면 대시보드에서 확인 후 이 값을 교체할 것)
      - key: CLIENT_ORIGIN
        value: https://korean-tales-client.onrender.com
      # 게스트 접속 차단 — 로그인(회원가입) 없이는 소켓 연결 불가
      - key: REQUIRE_AUTH
        value: "true"
      # 관리자 계정 이메일(쉼표 구분) — 정원 미달이어도 게임을 시작해 혼자 테스트할 수 있다
      - key: ADMIN_EMAILS
        value: hankyeoungkim@gmail.com
    # ── 영구 디스크 (starter 플랜 이상에서만 지원 — free에서 켜면 블루프린트 오류) ──
    # disk:
    #   name: korean-tales-data
    #   mountPath: /data
    #   sizeGB: 1

  - type: web
    name: korean-tales-client
    runtime: static
    buildCommand: npm install && npm run build --workspace @korean-tales/client
    staticPublishPath: client/dist
    envVars:
      - key: NODE_VERSION
        value: 22.23.1 # Node 22 LTS 고정 (CLAUDE.md의 Node 24 이슈 참고)
      # 게임 서버(REST + Socket.io) 주소 — 위 korean-tales-server 서비스의 실제 배포 URL과 일치해야 함
      - key: VITE_SERVER_URL
        value: https://korean-tales-server.onrender.com
    # SPA 라우팅 — 존재하지 않는 하위 경로는 모두 index.html로 라우팅
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
